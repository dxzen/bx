<!doctype html>
<html lang="zh-CN" data-theme="@@THEME@@" data-theme-version="@@THEME_VERSION@@">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@TITLE@@</title>
  <style>
@@CSS@@
  </style>
</head>
<body>
  <main class="reveal" aria-label="可行性分析报告">
    <div class="slides">
@@SLIDES@@
    </div>
  </main>
  <nav class="nav" aria-label="报告演示">
    <button type="button" id="previous" title="上一页（←）" aria-label="上一页" aria-keyshortcuts="ArrowLeft ArrowUp PageUp">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <output id="position" aria-label="页码" aria-live="polite" aria-atomic="true"></output>
    <button type="button" id="next" title="下一页（→）" aria-label="下一页" aria-keyshortcuts="ArrowRight ArrowDown PageDown">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>
    </button>
    <button type="button" id="fullscreen" title="进入全屏（F）" aria-label="进入全屏" aria-keyshortcuts="F" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg>
    </button>
    <button type="button" id="print" title="打印报告" aria-label="打印报告">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3"/><path d="M7 14h10v7H7zM16 11h1"/></svg>
    </button>
  </nav>
  <div class="progress-line" aria-hidden="true"><span></span></div>
  <script type="text/plain" id="reveal-license">@@LICENSE@@</script>
  <script>@@REVEAL@@</script>
  <script>@@RUNTIME@@</script>
</body>
</html>
